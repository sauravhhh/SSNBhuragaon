<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Result &mdash; Shankardev Shishu Niketan, Bhuragaon</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="images/logo.png">
<style>
:root{--navy:#16345f;--navy-dark:#0f2547;--gold:#c9a227;--cream:#faf7f0;--ink:#1c1c1c;--muted:#5c6470;--line:#e9e2d3;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;}
.rhead{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;}
.rhead img{width:44px;height:44px;object-fit:contain;}
.rhead .en{font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:16px;}
.rhead .as{font-size:12px;color:var(--muted);}
.wrap{max-width:520px;margin:0 auto;padding:28px 20px 60px;}
h1{font-family:Georgia,serif;color:var(--navy);font-size:26px;text-align:center;}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 22px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px rgba(22,52,95,.06);}
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:14px;}
select,input{width:100%;margin-top:6px;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
select:focus,input:focus{outline:2px solid var(--navy);outline-offset:-1px;}
.caprow{display:flex;gap:10px;align-items:center;margin-top:6px;}
#cap{border:1px solid var(--line);border-radius:10px;background:#f4f1e8;flex-shrink:0;}
#capRefresh{width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;cursor:pointer;color:var(--navy);}
.err{background:#fdecea;color:#a32b2b;border:1px solid #f5c6c6;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;}
.btn{display:block;width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;}
.btn:active{transform:scale(.99);}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy);margin-top:16px;}
.result h2{font-family:Georgia,serif;color:var(--navy);font-size:22px;text-align:center;}
.rmeta{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 16px;}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px;}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
td.m,th.m{text-align:center;}
.pass{color:#1e7e34;font-weight:700;}
.fail{color:#a32b2b;font-weight:700;}
.rtotal{display:flex;justify-content:space-between;font-size:15px;padding:10px 2px;border-top:2px solid var(--navy);}
.rtotal b{font-size:18px;}
.rdiv{text-align:center;margin-top:10px;font-family:Georgia,serif;font-size:19px;color:var(--navy);}
.rdiv.fail{color:#a32b2b;}
.rdiv.pass{color:#1e7e34;}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;}
.signrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;gap:16px;}
.stamp{width:112px;height:112px;transform:rotate(-8deg);opacity:.92;flex-shrink:0;}
.signblock{text-align:center;padding-bottom:6px;}
.signline{width:180px;max-width:40vw;border-bottom:2px solid var(--ink);height:36px;}
.signcap{font-size:13px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.5;}
.signcap span{font-weight:400;color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<header class="rhead">
  <img src="images/logo.png" alt="School emblem">
  <div><div class="en">Shankardev Shishu Niketan, Bhuragaon</div><div class="as">Result Portal</div></div>
</header>
<main class="wrap">
  <h1>Check Result</h1>
  <p class="sub">Annual Examination 2026</p>
  <form id="rform" class="card" autocomplete="off">
    <label>Class
      <select id="rclass"><option value="">Loading&hellip;</option></select>
    </label>
    <label>Roll No
      <input id="rroll" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 5">
    </label>
    <label style="margin-bottom:0">Security check &mdash; type the number shown
      <div class="caprow">
        <canvas id="cap" width="150" height="50"></canvas>
        <button type="button" id="capRefresh" aria-label="Get a new number">&#8635;</button>
      </div>
      <input id="rcap" inputmode="numeric" autocomplete="off" placeholder="Enter the number" style="margin-top:10px">
    </label>
    <div id="rerr" class="err" hidden></div>
    <button class="btn" type="submit" style="margin-top:16px">View Result</button>
  </form>
  <div id="rout" class="card result" hidden>
    <h2 id="rname"></h2>
    <div class="rmeta" id="rmeta"></div>
    <table>
      <thead><tr><th>Subject</th><th class="m">Marks</th><th class="m">Status</th></tr></thead>
      <tbody id="rtbody"></tbody>
    </table>
    <div class="rtotal"><span>Total (out of <span id="rmax"></span>)</span><b id="rtot"></b></div>
    <div class="rtotal"><span>Percentage</span><b id="rpct"></b></div>
    <div class="rdiv" id="rdiv"></div>
    <div class="signrow">
      <svg class="stamp" viewBox="0 0 120 120" aria-label="School stamp">
        <defs>
          <path id="stTop" d="M16,60 a44,44 0 1,1 88,0" fill="none"/>
          <path id="stBot" d="M16,60 a44,44 0 1,0 88,0" fill="none"/>
        </defs>
        <circle cx="60" cy="60" r="56" fill="none" stroke="#1a56a8" stroke-width="3"/>
        <circle cx="60" cy="60" r="48" fill="none" stroke="#1a56a8" stroke-width="1.5"/>
        <text font-size="11" font-weight="bold" fill="#1a56a8" font-family="sans-serif" letter-spacing="1"><textPath href="#stTop" startOffset="50%" text-anchor="middle">SHANKARDEV SHISHU NIKETAN</textPath></text>
        <text font-size="10.5" font-weight="bold" fill="#1a56a8" font-family="sans-serif" letter-spacing="1"><textPath href="#stBot" startOffset="50%" text-anchor="middle">BHURAGAON &#8226; MORIGAON</textPath></text>
        <text x="60" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a8" font-family="sans-serif">ESTD 2004</text>
        <text x="60" y="75" text-anchor="middle" font-size="11" fill="#1a56a8">&#9733;</text>
      </svg>
      <div class="signblock">
        <div class="signline"></div>
        <div class="signcap">Principal<br><span>Shankardev Shishu Niketan, Bhuragaon</span></div>
      </div>
    </div>
    <button class="btn" id="rdl" type="button" style="margin-top:10px">Download PDF</button>
    <button class="btn ghost" id="rback" type="button">Check another result</button>
  </div>
  <p class="note">For any correction, contact the school office.</p>
</main>

let classes = [];
const rclass = document.getElementById("rclass");
function buildDropdown() {
  rclass.innerHTML = '<option value="">Select class</option>';
  classes.forEach(c => {
    const o = document.createElement("option"); o.value = c.name; o.textContent = c.name; rclass.appendChild(o);
  });
}
function useData(data) { classes = data.classes; buildDropdown(); }
function xmlUnesc(s){ return s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'"); }
function colIdx(letters){ let n=0; for(const ch of letters) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
async function loadFromXlsx() {
  const res = await fetch(XLSX_URL, {cache:"no-store"});
  if (!res.ok) throw new Error("http "+res.status);
  const buf = await res.arrayBuffer();
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  const files = {};
  let off = 0;
  while (off + 30 <= u8.length) {
    if (dv.getUint32(off, true) !== 0x04034b50) break;
    const method = dv.getUint16(off+8, true);
    const csize = dv.getUint32(off+18, true);
    const fnLen = dv.getUint16(off+26, true), exLen = dv.getUint16(off+28, true);
    const name = td.decode(u8.slice(off+30, off+30+fnLen));
    const start = off+30+fnLen+exLen;
    files[name] = {method: method, data: u8.slice(start, start+csize)};
    off = start + csize;
  }
  async function readText(name) {
    const f = files[name]; if (!f) throw new Error("missing "+name);
    if (f.method === 0) return td.decode(f.data);
    if (f.method === 8) {
      const ds = new DecompressionStream("deflate");
      return await new Response(new Blob([f.data]).stream().pipeThrough(ds)).text();
    }
    throw new Error("bad compression");
  }
  const sh = await readText("xl/worksheets/sheet1.xml");
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
  const cellRe = /<c r="([A-Z]+)\d+"[^>]*>(?:<is><t>([^<]*)<\/t><\/is>|<v>([^<]*)<\/v>)/g;
  function parseRow(inner) {
    const rec = {};
    let cm;
    cellRe.lastIndex = 0;
    while ((cm = cellRe.exec(inner))) rec[colIdx(cm[1])] = cm[2] !== undefined ? xmlUnesc(cm[2]) : parseFloat(cm[3]);
    return rec;
  }
  const all = []; let rm;
  rowRe.lastIndex = 0;
  while ((rm = rowRe.exec(sh))) all.push(parseRow(rm[1]));
  const hrec = all[0];
  const rows = all.slice(1).filter(r => r[0] !== undefined && r[0] !== "Class" && r[1] !== undefined);
  if (!rows.length) throw new Error("no data rows");
  const subjCols = Object.keys(hrec).map(Number).filter(k => k >= 3).sort((a,b) => a-b);
  const order = [], byClass = {};
  rows.forEach(r => { const cn = r[0]; if (!byClass[cn]) { byClass[cn] = []; order.push(cn); } byClass[cn].push(r); });
  return {classes: order.map(cn => {
    const rs = byClass[cn];
    const subs = subjCols.filter(ci => rs.some(r => typeof r[ci] === "number"));
    return {
      name: cn,
      subjects: subs.map(ci => String(hrec[ci])),
      students: rs.map(r => ({roll: r[1], name: String(r[2]), marks: subs.map(ci => typeof r[ci] === "number" ? r[ci] : null)}))
    };
  })};
}
(async () => {
  try {
    if (typeof DecompressionStream === "undefined") throw new Error("no DecompressionStream");
    useData(await loadFromXlsx());
  } catch (e) {
    useData(FALLBACK_DATA);
  }
})();

    x.translate(24 + i * 26, 26 + (Math.random() * 8 - 4));
    x.rotate(Math.random() * 0.5 - 0.25);
    x.fillStyle = "#16345f";
    x.fillText(capCode[i], -9, 0);
    x.restore();
  }
  x.strokeStyle = "rgba(22,52,95,.28)"; x.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    x.beginPath();
    x.moveTo(Math.random() * 150, Math.random() * 50);
    x.quadraticCurveTo(Math.random() * 150, Math.random() * 50, Math.random() * 150, Math.random() * 50);
    x.stroke();
  }
  x.fillStyle = "rgba(22,52,95,.20)";
  for (let i = 0; i < 45; i++) x.fillRect(Math.random() * 150, Math.random() * 50, 1.6, 1.6);
}
document.getElementById("capRefresh").addEventListener("click", () => {
  drawCaptcha(); document.getElementById("rcap").value = ""; document.getElementById("rcap").focus();
});
drawCaptcha();

/* ---------- lookup ---------- */
let curCls = null, curSt = null;
const rform = document.getElementById("rform"), rout = document.getElementById("rout"), rerr = document.getElementById("rerr");
function showErr(msg) { rerr.textContent = msg; rerr.hidden = false; }
rform.addEventListener("submit", e => {
  e.preventDefault();
  rerr.hidden = true;
  const clsName = rclass.value, roll = parseInt(document.getElementById("rroll").value, 10);
  const cap = document.getElementById("rcap").value.trim();
  if (!clsName) return showErr("Please select a class.");
  if (!roll || roll < 1) return showErr("Please enter a valid roll number.");
  if (cap !== capCode) { drawCaptcha(); document.getElementById("rcap").value = ""; return showErr("Wrong security number. A new number has been generated — try again."); }
  const cls = classes.find(c => c.name === clsName);
  const s = cls && cls.students.find(s => s.roll === roll);
  if (!s) return showErr("No result found for " + clsName + ", roll no. " + roll + ". Check the details and try again.");
  curCls = cls; curSt = s;
  renderResult(cls, s);
  rform.hidden = true; rout.hidden = false;
  window.scrollTo({top: 0, behavior: "smooth"});
});
function renderResult(cls, s) {
  document.getElementById("rname").textContent = s.name;
  document.getElementById("rmeta").textContent = cls.name + "  ·  Roll No. " + s.roll;
  const tb = document.getElementById("rtbody"); tb.innerHTML = "";
  let total = 0, failed = false;
  cls.subjects.forEach((sub, i) => {
    const m = s.marks[i], ok = m >= 33;
    total += m; if (!ok) failed = true;
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + sub + "</td><td class='m'>" + m + " / 100</td><td class='m " + (ok ? "pass" : "fail") + "'>" + (ok ? "Pass" : "Fail") + "</td>";
    tb.appendChild(tr);
  });
  const max = cls.subjects.length * 100, pct = total / max * 100;
  document.getElementById("rmax").textContent = max;
  document.getElementById("rtot").textContent = total;
  document.getElementById("rpct").textContent = pct.toFixed(2) + "%";
  const dv = document.getElementById("rdiv");
  let div, dc;
  if (failed || pct < 33) { div = "Fail"; dc = "fail"; }
  else if (pct >= 60) { div = "First Division"; dc = "pass"; }
  else if (pct >= 45) { div = "Second Division"; dc = "pass"; }
  else { div = "Third Division"; dc = "pass"; }
  dv.textContent = div; dv.className = "rdiv " + dc;
}
document.getElementById("rback").addEventListener("click", () => {
  rout.hidden = true; rform.hidden = false;
  document.getElementById("rcap").value = ""; drawCaptcha();
  window.scrollTo({top: 0, behavior: "smooth"});
});

/* ---------- download result as image ---------- */

function pdfMarksheet() {
  if (!curCls || !curSt) return;
  const P = [];
  const navy = [0.09,0.20,0.37], ink = [0.10,0.10,0.10], muted = [0.38,0.41,0.46],
        green = [0.10,0.48,0.20], red = [0.66,0.18,0.18], sblue = [0.10,0.34,0.66],
        rule = [0.78,0.76,0.70], hfill = [0.949,0.945,0.929];
  const Y = v => 842 - v;
  const esc = t => String(t).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/[^\x20-\x7e]/g,"?");
  function T(x, y, str, font, size, c, rot) {
    rot = rot || 0;
    const cs = Math.cos(rot), sn = Math.sin(rot);
    P.push(c[0].toFixed(3)+" "+c[1].toFixed(3)+" "+c[2].toFixed(3)+" rg");
    P.push("BT /"+font+" "+size+" Tf "+cs.toFixed(4)+" "+sn.toFixed(4)+" "+(-sn).toFixed(4)+" "+cs.toFixed(4)+" "+x.toFixed(2)+" "+Y(y).toFixed(2)+" Tm ("+esc(str)+") Tj ET");
  }
  const wEst = (str, size, bold) => String(str).length * size * (bold ? 0.60 : 0.55);
  const TC = (cx, y, str, font, size, c) => T(cx - wEst(str, size, font === "F2") / 2, y, str, font, size, c);
  function line(x1, y1, x2, y2, w, c) {
    P.push(c[0].toFixed(3)+" "+c[1].toFixed(3)+" "+c[2].toFixed(3)+" RG "+w+" w "+x1.toFixed(2)+" "+Y(y1).toFixed(2)+" m "+x2.toFixed(2)+" "+Y(y2).toFixed(2)+" l S");
  }
  function fillRect(x, y, w, h, c) {
    P.push(c[0].toFixed(3)+" "+c[1].toFixed(3)+" "+c[2].toFixed(3)+" rg "+x.toFixed(2)+" "+Y(y+h).toFixed(2)+" "+w.toFixed(2)+" "+h.toFixed(2)+" re f");
  }
  function circle(cx, cy, r, w, c) {
    const k = 0.5522847498 * r, f = n => n.toFixed(2);
    P.push(c[0].toFixed(3)+" "+c[1].toFixed(3)+" "+c[2].toFixed(3)+" RG "+w+" w");
    P.push(f(cx-r)+" "+Y(cy).toFixed(2)+" m "+
      f(cx-r)+" "+Y(cy+k).toFixed(2)+" "+f(cx-k)+" "+Y(cy+r).toFixed(2)+" "+f(cx)+" "+Y(cy+r).toFixed(2)+" c "+
      f(cx+k)+" "+Y(cy+r).toFixed(2)+" "+f(cx+r)+" "+Y(cy+k).toFixed(2)+" "+f(cx+r)+" "+Y(cy).toFixed(2)+" c "+
      f(cx+r)+" "+Y(cy-k).toFixed(2)+" "+f(cx+k)+" "+Y(cy-r).toFixed(2)+" "+f(cx)+" "+Y(cy-r).toFixed(2)+" c "+
      f(cx-k)+" "+Y(cy-r).toFixed(2)+" "+f(cx-r)+" "+Y(cy-k).toFixed(2)+" "+f(cx-r)+" "+Y(cy).toFixed(2)+" c S");
  }
  function arcText(cxL, cyL, rT, str, top, size) {
    const n = str.length;
    const spread = Math.min(Math.PI*1.05, (n * size * 0.60) / rT);
    for (let i = 0; i < n; i++) {
      let a, rl;
      if (top) { a = -Math.PI/2 + (i/(n-1)-0.5)*spread; rl = a + Math.PI/2; }
      else { a = Math.PI/2 + (0.5-i/(n-1))*spread; rl = a - Math.PI/2; }
      T(cxL + rT*Math.cos(a), cyL + rT*Math.sin(a), str[i], "F2", size, sblue, -rl);
    }
  }
  // Letterhead
  TC(297.5, 54, "Shankardev Shishu Niketan, Bhuragaon", "F2", 20, navy);
  TC(297.5, 80, "Bhuragaon, Morigaon, Assam - Estd. 2004", "F1", 10.5, muted);
  line(50, 96, 545, 96, 1.4, navy);
  TC(297.5, 122, "MARKSHEET", "F2", 17, navy);
  TC(297.5, 144, "Annual Examination 2026", "F1", 11, ink);
  // Student
  let y = 176;
  T(50, y, "Name:", "F2", 11.5, ink);
  T(50 + wEst("Name: ", 11.5, true), y, curSt.name, "F1", 11.5, ink);
  const rs = "Roll No: " + curSt.roll;
  T(545 - wEst(rs, 11.5, false), y, rs, "F1", 11.5, ink);
  y += 24;
  T(50, y, "Class:", "F2", 11.5, ink);
  T(50 + wEst("Class: ", 11.5, true), y, curCls.name, "F1", 11.5, ink);
  // Marks table
  y += 36;
  const c0 = 50, c1 = 330, c2 = 440, c3 = 545, rh = 24, n = curCls.subjects.length;
  fillRect(c0, y, c3-c0, rh, hfill);
  T(c0+10, y+8.5, "SUBJECT", "F2", 10.5, muted);
  TC((c1+c2)/2, y+8.5, "MARKS", "F2", 10.5, muted);
  TC((c2+c3)/2, y+8.5, "STATUS", "F2", 10.5, muted);
  line(c0, y, c3, y, 1, rule); line(c0, y+rh+n*rh, c3, y+rh+n*rh, 1, rule);
  line(c0, y, c0, y+rh+n*rh, 1, rule); line(c3, y, c3, y+rh+n*rh, 1, rule);
  line(c1, y, c1, y+rh+n*rh, 0.8, rule); line(c2, y, c2, y+rh+n*rh, 0.8, rule);
  for (let i = 1; i <= n; i++) line(c0, y+rh*i, c3, y+rh*i, 0.8, rule);
  let total = 0, allPass = true;
  curCls.subjects.forEach((sub, i) => {
    const m = curSt.marks[i], ok = m !== null && m >= 33, ry = y + rh + i*rh;
    total += (m || 0); if (!ok) allPass = false;
    T(c0+10, ry+8, sub, "F1", 11, ink);
    TC((c1+c2)/2, ry+8, (m === null ? "-" : m + " / 100"), "F1", 11, ink);
    TC((c2+c3)/2, ry+8, ok ? "Pass" : "Fail", "F2", 11, ok ? green : red);
  });
  const max = n * 100, pct = total / max * 100;
  let ty = y + rh*(n+1) + 30;
  T(60, ty, "Total", "F2", 12, ink);
  TC((c1+c2)/2, ty, total + " / " + max, "F2", 12, ink);
  ty += 24;
  T(60, ty, "Percentage", "F2", 12, ink);
  TC((c1+c2)/2, ty, pct.toFixed(2) + "%", "F2", 12, ink);
  ty += 36;
  const div = !allPass ? "Fail" : pct >= 60 ? "First Division" : pct >= 45 ? "Second Division" : "Third Division";
  TC(297.5, ty, div.toUpperCase(), "F2", 15, div === "Fail" ? red : green);
  // Stamp + signature
  ty += 84;
  const scx = 150, scy = ty, R = 54;
  P.push("q 1 0 0 1 "+scx+" "+Y(scy).toFixed(2)+" cm 0.9903 -0.1395 0.1395 0.9903 0 0 cm 1 0 0 1 "+(-scx)+" "+(-Y(scy)).toFixed(2)+" cm");
  circle(scx, scy, R, 2.6, sblue);
  circle(scx, scy, R-8, 1.2, sblue);
  arcText(scx, scy, R-12, "SHANKARDEV SHISHU NIKETAN", true, 8);
  arcText(scx, scy, R-12, "BHURAGAON - MORIGAON", false, 8);
  TC(scx, scy-5, "ESTD 2004", "F2", 11, sblue);
  P.push("Q");
  const sx0 = 368, sx1 = 545, sly = ty + 64;
  line(sx0, sly, sx1, sly, 1.2, ink);
  TC((sx0+sx1)/2, sly+24, "Principal", "F1", 11, ink);
  TC((sx0+sx1)/2, sly+40, "Shankardev Shishu Niketan, Bhuragaon", "F1", 8.5, muted);
  // Footer
  const dstr = new Date().toLocaleDateString("en-IN", {day:"numeric", month:"long", year:"numeric"});
  TC(297.5, ty+168, "Generated on " + dstr, "F1", 9, muted);
  TC(297.5, ty+184, "For corrections, contact the school office.", "F1", 9, muted);
  // Assemble PDF
  const stream = P.join("\n");
  const objs = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>",
    "<< /Length " + (stream.length + 1) + " >>\nstream\n" + stream + "\nendstream"
  ];
  let pdf = "%PDF-1.4\n";
  const offs = [0];
  for (let i = 0; i < 6; i++) { offs.push(pdf.length); pdf += (i+1) + " 0 obj\n" + objs[i] + "\nendobj\n"; }
  const xref = pdf.length;
  pdf += "xref\n0 7\n0000000000 65535 f \n";
  for (let i = 1; i <= 6; i++) pdf += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  pdf += "trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  const blob = new Blob([new TextEncoder().encode(pdf)], {type: "application/pdf"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Result_" + curCls.name.replace(/\s+/g,"") + "_Roll" + curSt.roll + "_" + curSt.name.replace(/\s+/g,"_") + ".pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
document.getElementById("rdl").addEventListener("click", pdfMarksheet);

</script>
